version: '3.8'

services:
  # 1. Frontend (Nginx + React)
  frontend:
    container_name: frontend-server
    image: frontend-image:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network
    restart: always
    depends_on:
      - backend

  # 2. Spring Boot 백엔드
  backend:
    container_name: backend-server
    image: backend-image:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-container:3306/mydb?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD}

      # Redis 설정
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}

      # OpenVidu 설정 환경변수 주입
      - OPENVIDU_URL=${OPENVIDU_URL}
      - OPENVIDU_SECRET=${OPENVIDU_SECRET}

      # JWT 및 OAuth 설정
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXP_MIN=${JWT_ACCESS_EXP_MIN}
      - JWT_REFRESH_EXP_DAYS=${JWT_REFRESH_EXP_DAYS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}

      - DOMAIN_URL=${DOMAIN_URL}

      - FRONT_OAUTH_REDIRECT_URL=http://13.125.3.38/oauth/callback
      - FRONT_RESET_PASSWORD_URL=http://13.125.3.38/reset-password

      - COOKIE_SECURE=${COOKIE_SECURE}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}

      #  S3 접속 정보 추가
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}

     # GMS API Key
      - GMS_KEY=${GMS_KEY}
    networks:
      - app-network
    restart: on-failure
    depends_on:
      - mysql
      - redis
      - openvidu

  # 3. OpenVidu Server (화상회의 엔진)
  openvidu:
    image: openvidu/openvidu-dev:2.29.0
    container_name: openvidu-server
    restart: always
    ports:
      - "4443:4443"
    environment:
      - OPENVIDU_SECRET=${OPENVIDU_SECRET}
      - OPENVIDU_PUBLIC_URL=${OPENVIDU_PUBLIC_URL}
      - DOMAIN_OR_PUBLIC_IP=${DOMAIN_OR_PUBLIC_IP}
      - HTTPS_PORT=4443
    networks:
      - app-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # 4. MySQL
  mysql:
    container_name: mysql-container
    image: mysql:8.0.23
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: mydb
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # 5. Redis
  redis:
    container_name: redis-container
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    command: redis-server --appendonly yes

volumes:
  mysql_data:
  redis_data:

networks:
  app-network:
    driver: bridge