version: '3.8'

services:
  # 1. Frontend (Nginx + React)
  frontend:
    container_name: frontend-server
    image: frontend-image:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network
    restart: always
    depends_on:
      - backend

  # [AI Server - 잠시 주석 유지]
  # ai-server:
  #   build:
  #     context: ./ai
  #   container_name: ai-server
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./ai/model:/app/model
  #   networks:
  #     - app-network
  #   restart: always

  # 2. Spring Boot Backend
  backend:
    container_name: backend-server
    image: backend-image:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-container:3306/mydb?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - OPENVIDU_URL=${OPENVIDU_URL}
      - OPENVIDU_SECRET=${OPENVIDU_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXP_MIN=${JWT_ACCESS_EXP_MIN}
      - JWT_REFRESH_EXP_DAYS=${JWT_REFRESH_EXP_DAYS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - DOMAIN_URL=${DOMAIN_URL}
      - FRONT_OAUTH_REDIRECT_URL=${FRONT_OAUTH_REDIRECT_URL}
      - FRONT_RESET_PASSWORD_URL=${FRONT_RESET_PASSWORD_URL}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - GMS_KEY=${GMS_KEY}
    networks:
      - app-network
    restart: on-failure
    depends_on:
      - mysql
      - redis
      - openvidu
      # - ai-server

  # 3. OpenVidu Server
  openvidu:
    image: openvidu/openvidu-dev:2.29.0
    container_name: openvidu-server
    restart: always
    ports:
      - "4443:443"   # 호스트:컨테이너 (필요없으면 제거 가능)
    networks:
      - app-network
    environment:
      - OPENVIDU_SECRET=${OPENVIDU_SECRET}
      - OPENVIDU_PUBLIC_URL=https://openvidu.i14c109.p.ssafy.io
      - DOMAIN_OR_PUBLIC_IP=openvidu.i14c109.p.ssafy.io
      - HTTPS_PORT=443
      - HTTP_PORT=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # 4. MySQL
  mysql:
    container_name: mysql-container
    image: mysql:8.0.23
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: mydb
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # 5. Redis
  redis:
    container_name: redis-container
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    command: redis-server --appendonly yes

  # 6. Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring:/etc/prometheus/custom_config
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/custom_config/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9091:9090"
    networks:
      - app-network
    restart: always

  # 7. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network
    restart: always
    depends_on:
      - prometheus

  # 8. Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: always
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - app-network

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
