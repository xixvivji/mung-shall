spring.application.name=backend

# MySQL Datasource
spring.datasource.url=jdbc:mysql://13.125.3.38:3306/mydb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_ROOT_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Server
server.port=8080
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-exp-min=${JWT_ACCESS_EXP_MIN}
jwt.refresh-exp-days=${JWT_REFRESH_EXP_DAYS}

# OAuth2 - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://i14c109.p.ssafy.io/login/oauth2/code/google
# OAuth2 - Kakao
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=https://i14c109.p.ssafy.io/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# OAuth2 - Naver
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri=https://i14c109.p.ssafy.io/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.registration.naver.client-name=Naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Front redirect (OAuth callback)
app.front-oauth-redirect-url=https://i14c109.p.ssafy.io/oauth/callback}

# Cookie options
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.samesite=${COOKIE_SAMESITE:Lax}

# OpenVidu
openvidu.url=${OPENVIDU_URL}
openvidu.secret=${OPENVIDU_SECRET}

# Password reset link (front page)
app.front-reset-password-url=${FRONT_RESET_PASSWORD_URL:http://localhost:3000/reset-password}

# Reset token TTL minutes
app.password-reset-ttl-min=${PASSWORD_RESET_TTL_MIN:15}

# Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Public Data API V2
api.abandoned-dog.url=https://apis.data.go.kr/1543061/abandonmentPublicService_v2/abandonmentPublic_v2
api.abandoned-dog.serviceKey=de5c225dd1f14f9ddcb3ab059d0b841c2c7f910694104c7f215faa5572a77e3d
api.abandoned-dog.upkind=417000
api.abandoned-dog.numOfRows=1000


# AWS S3
cloud.aws.credentials.access-key=${S3_ACCESS_KEY}
cloud.aws.credentials.secret-key=${S3_SECRET_KEY}
cloud.aws.s3.bucket=${S3_BUCKET_NAME}
cloud.aws.region.static=ap-northeast-2
cloud.aws.stack.auto=false

# AWS S3 File upload limits
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB


spring.ai.openai.api-key=${GMS_KEY}
spring.ai.openai.base-url=https://gms.ssafy.io/gmsapi/api.openai.com
spring.ai.openai.chat.options.model=gpt-5

spring.ai.vertex.ai.gemini.api-key=${GMS_KEY}
spring.ai.vertex.ai.gemini.base-url=https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com
spring.ai.vertex.ai.gemini.chat.options.model=gemini-2.5-pro

spring.ai.vertex.ai.gemini.project-id=ssafy-dummy-project
spring.ai.vertex.ai.gemini.location=us-central1