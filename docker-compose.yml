version: '3.8'

services:
  # 1. Frontend (Nginx + React)
  frontend:
    container_name: frontend-server
    image: frontend-image:latest
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network
    restart: always
    depends_on:
      - backend

  # 2. Spring Boot Backend
  backend:
    container_name: backend-server
    image: backend-image:latest
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-container:3306/mydb?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - OPENVIDU_URL=${OPENVIDU_URL}
      - OPENVIDU_SECRET=${OPENVIDU_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXP_MIN=${JWT_ACCESS_EXP_MIN}
      - JWT_REFRESH_EXP_DAYS=${JWT_REFRESH_EXP_DAYS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - DOMAIN_URL=${DOMAIN_URL}
      - FRONT_OAUTH_REDIRECT_URL=${FRONT_OAUTH_REDIRECT_URL}
      - FRONT_RESET_PASSWORD_URL=${FRONT_RESET_PASSWORD_URL}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - GMS_KEY=${GMS_KEY}
    networks:
      - app-network
    restart: on-failure
    depends_on:
      - mysql
      - redis
      - openvidu-server

  # 3. OpenVidu Server (Production)
  openvidu-server:
    image: openvidu/openvidu-server:2.32.1
    container_name: openvidu-server
    restart: on-failure
    network_mode: host
    entrypoint: ['/usr/local/bin/entrypoint.sh']
    volumes:
      - ./openvidu/coturn:/run/secrets/coturn
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/opt/openvidu/.env:ro
      - /opt/openvidu/owncert:/opt/openvidu/owncert:ro
    env_file:
      - .env
    environment:
      - SERVER_SSL_ENABLED=true
      - SERVER_PORT=8443
      - KMS_URIS=["ws://localhost:8888/kurento"]
      - COTURN_IP=${COTURN_IP:-auto-ipv4}
      - COTURN_PORT=${COTURN_PORT:-8700}
    logging:
      options:
        max-size: "${DOCKER_LOGS_MAX_SIZE:-100M}"

  # 4. KMS
  kms:
    image: ${KMS_IMAGE:-kurento/kurento-media-server:7.3.0}
    container_name: kms
    restart: always
    network_mode: host
    ulimits:
      core: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - /opt/openvidu/kms-crashes:/opt/openvidu/kms-crashes
      - /opt/openvidu/kurento-logs:/opt/openvidu/kurento-logs
    environment:
      - KMS_MIN_PORT=8500
      - KMS_MAX_PORT=8699
      - GST_DEBUG=${KMS_DOCKER_ENV_GST_DEBUG:-}
      - KURENTO_LOG_FILE_SIZE=${KMS_DOCKER_ENV_KURENTO_LOG_FILE_SIZE:-100}
      - KURENTO_LOGS_PATH=/opt/openvidu/kurento-logs
    logging:
      options:
        max-size: "${DOCKER_LOGS_MAX_SIZE:-100M}"

  # 5. Coturn
  coturn:
    image: openvidu/openvidu-coturn:2.32.1
    container_name: openvidu-coturn
    restart: on-failure
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./openvidu/coturn:/run/secrets/coturn
    command:
      - --log-file=stdout
      - --listening-port=${COTURN_PORT:-8700}
      - --listening-ip=0.0.0.0
      - --relay-ip=${COTURN_PRIVATE_IP}
      - --external-ip=${COTURN_PUBLIC_IP}/${COTURN_PRIVATE_IP}
      - --fingerprint
      - --min-port=${COTURN_MIN_PORT:-8701}
      - --max-port=${COTURN_MAX_PORT:-8900}
      - --realm=openvidu
      - --verbose
      - --use-auth-secret
      - --static-auth-secret=${COTURN_SHARED_SECRET_KEY}
    logging:
      options:
        max-size: "${DOCKER_LOGS_MAX_SIZE:-100M}"

  # 6. MySQL
  mysql:
    container_name: mysql-container
    image: mysql:8.0.23
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: mydb
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # 7. Redis
  redis:
    container_name: redis-container
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    command: redis-server --appendonly yes

  # 8. Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring:/etc/prometheus/custom_config
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/custom_config/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9091:9090"
    networks:
      - app-network
    restart: always

  # 9. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network
    restart: always
    depends_on:
      - prometheus

  # 10. Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: always
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - app-network

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
