global:
  scrape_interval: 15s

scrape_configs:
  # 1. 프로메테우스 자체 상태
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. EC2 호스트 리소스 (CPU, RAM, HDD 등)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. AI 서버 모니터링 (추가 설정 필요)
  # - job_name: 'ai-server'
  #   metrics_path: '/metrics'
  #   static_configs:
  #     - targets: ['ai-server:8000']